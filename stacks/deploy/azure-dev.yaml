# Usage: CLUSTER_NAME=<name> atmos terraform plan k8s-cluster -s azure-dev
import:
  - mixins/azure
  - catalog/defaults
  - catalog/argocd

vars:
  stage: dev
  cluster_name: !env CLUSTER_NAME

components:
  terraform:
    k8s-cluster:
      metadata:
        component: azure/k8s-cluster
        terraform_workspace: '{{ env "CLUSTER_NAME" | default "CLUSTER_NAME-not-set" }}'
      backend:
        azurerm:
          key: k8s-cluster.tfstate
      vars:
        region: eastus
        instance_type: !env INSTANCE_TYPE Standard_D2as_v4 # Standard_D2s_v5
        node_count: !env NODE_COUNT 2 # 3

  helmfile:
    # Deep-merged over stacks/catalog/argocd.yaml
    argocd:
      vars:
        values:
          configs:
            params:
              server.insecure: false # exposed directly: argocd-server serves HTTPS itself (self-signed cert)
          server:
            service:
              type: LoadBalancer
              annotations:
                service.beta.kubernetes.io/azure-load-balancer-ipv4: !terraform.state k8s-cluster ingress_ip
