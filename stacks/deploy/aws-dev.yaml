# Usage: CLUSTER_NAME=<name> atmos terraform plan k8s-cluster -s aws-dev
import:
  - mixins/aws
  - catalog/defaults
  - catalog/argocd

vars:
  stage: dev
  cluster_name: !env CLUSTER_NAME

components:
  terraform:
    k8s-cluster:
      metadata:
        component: aws/k8s-cluster
        # One workspace (= one state) per cluster
        terraform_workspace: '{{ env "CLUSTER_NAME" | default "CLUSTER_NAME-not-set" }}'
      backend:
        s3:
          key: kubernetes-install.tfstate
      vars:
        region: us-east-1
        kubernetes_version: "1.33"
        instance_type: !env INSTANCE_TYPE m6i.large
        node_count: !env NODE_COUNT 3

    # Replaces default gp2 StorageClass; needs KUBECONFIG for the cluster (see stacks/workflows/k8s.yaml)
    storage-class:
      metadata:
        component: aws/storage-class
        terraform_workspace: '{{ env "CLUSTER_NAME" | default "CLUSTER_NAME-not-set" }}'
      env:
        KUBE_CONFIG_PATH: !env KUBECONFIG
      backend:
        s3:
          key: storage-class.tfstate
