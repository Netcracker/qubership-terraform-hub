# Usage: CLUSTER_NAME=<name> atmos terraform plan k8s-cluster -s aws-dev
import:
  - mixins/aws

vars:
  stage: dev
  cluster_name: !env CLUSTER_NAME

components:
  terraform:
    k8s-cluster:
      metadata:
        component: aws/k8s-cluster
        # One workspace (= one state) per cluster
        terraform_workspace: '{{ env "CLUSTER_NAME" | default "CLUSTER_NAME-not-set" }}'
      backend:
        s3:
          key: kubernetes-install.tfstate
      vars:
        region: us-east-1
        kubernetes_version: "1.33"
        instance_type: m6i.large
        node_count: 3

    # Replaces default gp2 StorageClass; needs kubeconfig for the cluster (aws eks update-kubeconfig)
    storage-class:
      metadata:
        component: aws/storage-class
        terraform_workspace: '{{ env "CLUSTER_NAME" | default "CLUSTER_NAME-not-set" }}'
      backend:
        s3:
          key: storage-class.tfstate
