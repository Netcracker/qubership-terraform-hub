# K8ssandraCluster CR, rendered by charts/raw after k8ssandra-operator
manifests:
  - apiVersion: k8ssandra.io/v1alpha1
    kind: K8ssandraCluster
    metadata:
      name: cassandra
    spec:
      cassandra:
        serverVersion: "4.1.10"
        datacenters:
          - metadata:
              name: dc1
            size: 3
            storageConfig:
              cassandraDataVolumeClaimSpec:
                storageClassName: default-rwo
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 5Gi
            config:
              jvmOptions:
                heapSize: 2048M
