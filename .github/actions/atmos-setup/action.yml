name: Atmos setup
description: >-
  Installs Atmos and signs in to the cloud of the stack, so `atmos` commands (terraform, helmfile, kubeconfig exec auth) work.
  Terraform, helm, helmfile, kubectl, jq come from the Atmos toolchain and are cached between runs with Terraform providers.
inputs:
  cloud:
    description: aws | azure | gcp
    required: true
  atmos-version:
    description: Atmos release
    default: 1.230.0
  aws-access-key-id:
    description: AWS credentials (cloud=aws)
    default: ""
  aws-secret-access-key:
    description: AWS credentials (cloud=aws)
    default: ""
  aws-oidc:
    description: AWS OIDC provider ARN (cloud=aws)
    default: ""
  aws-region:
    description: AWS region (cloud=aws)
    default: us-east-1
  gcp-credentials:
    description: Service account JSON (cloud=gcp)
    default: ""
  arm-client-id:
    description: Azure service principal (cloud=azure)
    default: ""
  arm-client-secret:
    description: Azure service principal (cloud=azure)
    default: ""
  arm-tenant-id:
    description: Azure tenant (cloud=azure)
    default: ""
  arm-subscription-id:
    description: Azure subscription (cloud=azure)
    default: ""
runs:
  using: composite
  steps:
    - name: Install Atmos
      shell: bash
      env:
        ATMOS_VERSION: ${{ inputs.atmos-version }}
      run: |
        cd "$RUNNER_TEMP"
        base="https://github.com/cloudposse/atmos/releases/download/v${ATMOS_VERSION}"
        bin="atmos_${ATMOS_VERSION}_linux_amd64"
        curl -fsSLO "$base/$bin"
        curl -fsSL "$base/atmos_${ATMOS_VERSION}_SHA256SUMS" | grep " ${bin}$" | sha256sum -c -
        sudo install -m 0755 "$bin" /usr/local/bin/atmos
        atmos version
        # Written by `atmos workflow kubeconfig`, outside the workspace
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

    # One cache per cloud (each has its own Terraform providers); a new key when tool or provider versions may change.
    # ponytail: providers are pinned with `~>` and no lock file, so a new provider patch is re-downloaded on every run
    # until one of the hashed files changes; commit .terraform.lock.hcl and hash it if that matters.
    - name: Atmos cache key
      shell: bash
      env:
        PREFIX: atmos-${{ runner.os }}-${{ inputs.cloud }}-
        VERSIONS: ${{ hashFiles('atmos.yaml', 'stacks/catalog/defaults.yaml', 'stacks/workflows/**', 'components/terraform/**/*.tf') }}
      run: |
        echo "ATMOS_CACHE_KEY=${PREFIX}${VERSIONS}" >> "$GITHUB_ENV"
        echo "ATMOS_CACHE_RESTORE_KEY=${PREFIX}" >> "$GITHUB_ENV"

    # Restores the Atmos cache root (ci.cache in atmos.yaml) now and saves it in the post step at job end
    - name: Atmos cache
      uses: cloudposse/atmos/actions/cache@e4269500304cba367d6a204ba3901c539ca943fc # v1.230.0

    - name: Configure AWS credentials
      if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-oidc }}

    # Terraform (azurerm provider and backend) reads ARM_* directly; AKS kubeconfig is certificate-based, so no az login
    - name: Configure Azure credentials
      if: inputs.cloud == 'azure'
      shell: bash
      env:
        ARM_CLIENT_ID: ${{ inputs.arm-client-id }}
        ARM_CLIENT_SECRET: ${{ inputs.arm-client-secret }}
        ARM_TENANT_ID: ${{ inputs.arm-tenant-id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.arm-subscription-id }}
      run: |
        for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
          test -n "${!v}" || { echo "::error::$v is empty"; exit 1; }
          echo "$v=${!v}" >> "$GITHUB_ENV"
        done

    - name: Configure GCP credentials
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        credentials_json: ${{ inputs.gcp-credentials }}

    # Kubeconfig of GKE authenticates through this plugin (aws CLI plays the same role on EKS and ships with the runner)
    - name: Install gke-gcloud-auth-plugin
      if: inputs.cloud == 'gcp'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin
