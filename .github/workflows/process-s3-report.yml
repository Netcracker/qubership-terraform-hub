name: Process Test Results

on:
  workflow_dispatch:
    inputs:
      s3_directory:
        description: 'S3 Directory Path (e.g., Result/consul/2025-12-10/00-42-50/)'
        required: true
        default: 'Result/consul/2025-12-10/00-42-50'
        type: string
  repository_dispatch:
    types: [s3-new-result-directory]

env:
  S3_BUCKET: qstp-results
  OUTPUT_DIR: ./allure-report
  SINGLE_FILE_DIR: ./allure-single-file
  SOURCE_DIR: ./allure-results

jobs:
  generate-allure-report:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Parse S3 path
        id: parse_path
        env:
          EVENT_NAME: ${{ github.event_name }}
          S3_DIRECTORY_INPUT: ${{ github.event.inputs.s3_directory }}
          CLIENT_PAYLOAD_DIRECTORY: ${{ github.event.client_payload.directory }}
        run: |
          # Parse S3 directory from input
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            S3_DIR="$S3_DIRECTORY_INPUT"
            echo "Using manual input: $S3_DIR"
          elif [ "$EVENT_NAME" == "repository_dispatch" ]; then
            S3_DIR="$CLIENT_PAYLOAD_DIRECTORY"
            echo "Using repository dispatch: $S3_DIR"
          else
            echo "Unknown trigger"
            exit 1
          fi

          # Remove trailing slash if present
          S3_DIR=${S3_DIR%/}
          echo "S3_DIR=$S3_DIR" >> $GITHUB_OUTPUT

          # Extract test type (the folder after Result/)
          # Format: Result/[test-type]/YYYY-MM-DD/HH-MM-SS
          TEST_TYPE=$(echo "$S3_DIR" | cut -d'/' -f2)
          echo "TEST_TYPE=$TEST_TYPE" >> $GITHUB_OUTPUT

          # Extract timestamp path (everything after Result/[test-type]/)
          TIMESTAMP_PATH=${S3_DIR#Result/"$TEST_TYPE"/}
          echo "TIMESTAMP_PATH=$TIMESTAMP_PATH" >> $GITHUB_OUTPUT

          # Create safe identifier
          SAFE_ID="$(echo "$TIMESTAMP_PATH" | sed 's|/|_|g' | sed 's|-|_|g')"
          echo "SAFE_ID=$SAFE_ID" >> $GITHUB_OUTPUT

          echo "Parsed: Timestamp: $TIMESTAMP_PATH"
          echo "Report path: Report/$TIMESTAMP_PATH"

      - name: Download Allure results from S3
        id: download
        env:
          PARSED_S3_DIR: ${{ steps.parse_path.outputs.S3_DIR }}
        run: |
          echo "Downloading from: s3://$S3_BUCKET/$PARSED_S3_DIR/"
          mkdir -p $SOURCE_DIR

          # First, check what's in S3
          echo "Listing S3 contents:"
          aws s3 ls "s3://$S3_BUCKET/$PARSED_S3_DIR/" --recursive || true

          # Download ALL files from the S3 directory (including subdirectories)
          echo "Downloading files..."
          aws s3 sync "s3://$S3_BUCKET/$PARSED_S3_DIR/" $SOURCE_DIR/ \
            --exclude "*" --include "*.xml" --include "*.json" --include "*.txt"

          # Ensure the dedicated pass‑rate file is present
          PASS_RATE_FILE="email-notification-results-generated.json"
          if [ ! -f "$SOURCE_DIR/$PASS_RATE_FILE" ]; then
            echo "Pass‑rate file not found after sync; trying direct download..."
            aws s3 cp "s3://$S3_BUCKET/$PARSED_S3_DIR/$PASS_RATE_FILE" \
                     "$SOURCE_DIR/$PASS_RATE_FILE" || true
          fi

          # Check what was downloaded
          echo "Downloaded files:"
          find $SOURCE_DIR -type f | sort

          # Count files
          XML_COUNT=$(find $SOURCE_DIR -name "*.xml" | wc -l)
          JSON_COUNT=$(find $SOURCE_DIR -name "*.json" | wc -l)
          echo "XML_FILES=$XML_COUNT" >> $GITHUB_OUTPUT
          echo "JSON_FILES=$JSON_COUNT" >> $GITHUB_OUTPUT
          echo "Total files downloaded: $(find $SOURCE_DIR -type f | wc -l)"

          # If no files, try downloading everything
          if [ $XML_COUNT -eq 0 ] && [ $JSON_COUNT -eq 0 ]; then
            echo "No XML/JSON files found with filters, downloading everything..."
            aws s3 sync "s3://$S3_BUCKET/$PARSED_S3_DIR/" $SOURCE_DIR/

            XML_COUNT=$(find $SOURCE_DIR -name "*.xml" | wc -l)
            JSON_COUNT=$(find $SOURCE_DIR -name "*.json" | wc -l)
            echo "After full sync - XML: $XML_COUNT, JSON: $JSON_COUNT"
          fi

          # Check file contents
          if [ $XML_COUNT -gt 0 ]; then
            echo "Checking first XML file structure:"
            FIRST_XML=$(find $SOURCE_DIR -name "*.xml" | head -1)
            head -20 "$FIRST_XML"
          fi

      - name: Parse Pass Rate from Generated JSON
        id: pass_rate
        env:
          PARSED_S3_DIR: ${{ steps.parse_path.outputs.S3_DIR }}
        run: |
          RESULTS_FILE="email-notification-results-generated.json"
      
          # ── 1. Try to find the file locally (any sub‑directory) ────────────────
          LOCAL_PATH=$(find "$SOURCE_DIR" -type f -name "$RESULTS_FILE" 2>/dev/null | head -1)
      
          # ── 2. Fallback: search S3 recursively and copy the exact key ─────────
          if [ -z "$LOCAL_PATH" ] || [ ! -f "$LOCAL_PATH" ]; then
            echo "Not found locally; searching S3 recursively under $PARSED_S3_DIR/ ..."
            S3_KEY=$(aws s3 ls "s3://$S3_BUCKET/$PARSED_S3_DIR/" --recursive \
                       | awk '{print $NF}' \
                       | grep -F "$RESULTS_FILE" \
                       | head -1)
            if [ -n "$S3_KEY" ]; then
              echo "Found in S3 at: s3://$S3_BUCKET/$S3_KEY"
              LOCAL_PATH="$SOURCE_DIR/$RESULTS_FILE"
              aws s3 cp "s3://$S3_BUCKET/$S3_KEY" "$LOCAL_PATH" --only-show-errors || true
            fi
          fi

          # ── 3. Give up gracefully with debug info ────────────────────────────
          if [ -z "$LOCAL_PATH" ] || [ ! -f "$LOCAL_PATH" ]; then
            echo "❌ $RESULTS_FILE could not be located."
            echo "--- Debug: files present under $SOURCE_DIR ---"
            find "$SOURCE_DIR" -type f | sort || true
            echo "--- Debug: S3 listing for $PARSED_S3_DIR ---"
            aws s3 ls "s3://$S3_BUCKET/$PARSED_S3_DIR/" --recursive || true
            {
              echo "PASS_RATE=No data"
              echo "TOTAL_TESTS=0"
              echo "PASSED_TESTS=0"
              echo "SKIPPED_TESTS=0"
              echo "UNKNOWN_TESTS=0"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Using results file: $LOCAL_PATH"

          # ── 4. Sanity check: valid JSON? ─────────────────────────────────────
          if ! jq empty "$LOCAL_PATH" 2>/dev/null; then
            echo "❌ File is not valid JSON. First 200 bytes:"
            head -c 200 "$LOCAL_PATH"
            echo
            {
              echo "PASS_RATE=No data"
              echo "TOTAL_TESTS=0"
              echo "PASSED_TESTS=0"
              echo "SKIPPED_TESTS=0"
              echo "UNKNOWN_TESTS=0"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── 5. Extract values ─────────────────────────────────────────────────
          PASS_RATE=$(jq -r '.test_results.pass_rate // "No data"' "$LOCAL_PATH")
          TOTAL_TESTS=$(jq -r '.test_results.total_count // 0' "$LOCAL_PATH")
          PASSED_TESTS=$(jq -r '.test_results.passed_count // 0' "$LOCAL_PATH")
          SKIPPED_TESTS=$(jq -r '.test_results.skipped_count // 0' "$LOCAL_PATH")
          FAILED_TESTS=$(jq -r '.test_results.failed_count // 0' "$LOCAL_PATH")
          UNKNOWN_TESTS=$(jq -r '
            ((.test_results.total_count // 0) -
             (.test_results.passed_count // 0) -
             (.test_results.skipped_count // 0) -
             (.test_results.failed_count // 0))' "$LOCAL_PATH")

          if [[ "$PASS_RATE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            PASS_RATE="${PASS_RATE}%"
          fi

          echo "=== Parsed Test Summary from $RESULTS_FILE ==="
          echo "Pass Rate: $PASS_RATE"
          echo "Total Tests: $TOTAL_TESTS"
          echo "Passed: $PASSED_TESTS"
          echo "Skipped: $SKIPPED_TESTS"
          echo "Failed: $FAILED_TESTS"
          echo "Unknown/Other: $UNKNOWN_TESTS"

          {
            echo "PASS_RATE=${PASS_RATE}"
            echo "TOTAL_TESTS=${TOTAL_TESTS}"
            echo "PASSED_TESTS=${PASSED_TESTS}"
            echo "SKIPPED_TESTS=${SKIPPED_TESTS}"
            echo "UNKNOWN_TESTS=${UNKNOWN_TESTS}"
          } >> $GITHUB_OUTPUT

      - name: Install Java and Allure
        run: |
          # Update and install dependencies
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre curl unzip

          # Fetch the latest Allure release download URL from the GitHub API
          ALLURE_URL=$(curl -s https://api.github.com/repos/allure-framework/allure2/releases/latest \
            | grep '"browser_download_url":' \
            | grep -o 'https://[^"]*allure-[0-9][^"]*\.zip' \
            | head -1)

          if [ -z "$ALLURE_URL" ]; then
            echo "❌ Failed to fetch the latest Allure release URL."
            exit 1
          fi
          echo "Latest Allure URL: $ALLURE_URL"

          # Extract the version from the URL, e.g. .../2.35.1/allure-2.35.1.zip -> 2.35.1
          ALLURE_VERSION=$(echo "$ALLURE_URL" | sed -E 's|.*/allure-([0-9.]+)\.zip|\1|')
          echo "Latest Allure version: $ALLURE_VERSION"

          # Download and install
          curl -L -o "allure-${ALLURE_VERSION}.zip" "$ALLURE_URL"
          unzip -q "allure-${ALLURE_VERSION}.zip" -d /opt/
          sudo ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure

          # Verify
          echo "Java version:"
          java -version
          echo "Allure version:"
          allure --version

      - name: Generate Allure Reports
        id: generate
        env:
          XML_FILES: ${{ steps.download.outputs.XML_FILES }}
          JSON_FILES: ${{ steps.download.outputs.JSON_FILES }}
          PARSED_TEST_TYPE: ${{ steps.parse_path.outputs.TEST_TYPE }}
        run: |
          echo "Generating Allure reports from: $SOURCE_DIR for test type: $PARSED_TEST_TYPE"

          # Clean previous reports
          rm -rf $OUTPUT_DIR $SINGLE_FILE_DIR
          mkdir -p $OUTPUT_DIR $SINGLE_FILE_DIR

          # Check if we have test files
          if [ "${XML_FILES:-0}" -gt 0 ] || [ "${JSON_FILES:-0}" -gt 0 ]; then
            echo "Found test files, generating reports..."
            pwd
            echo "Debug contents of allure-results"
            echo "$SOURCE_DIR"
            ls -la $SOURCE_DIR/

            # Generate multi-file report
            echo "Generating multi-file report..."
            /usr/local/bin/allure generate $SOURCE_DIR/allure-results -o $OUTPUT_DIR/ --clean

            echo "Generated files in $OUTPUT_DIR"
            ls -la $OUTPUT_DIR/

            # Generate single-file report
            echo "Generating single-file report..."
            /usr/local/bin/allure generate $SOURCE_DIR/allure-results -o $SINGLE_FILE_DIR --clean --single-file

            echo "Generated files in $SINGLE_FILE_DIR"
            ls -la $SINGLE_FILE_DIR/

            # Check results
            if [ -f "$OUTPUT_DIR/index.html" ]; then
              echo "✅ Multi-file report generated"
              echo "REPORT_GENERATED=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Multi-file report failed"
              echo "REPORT_GENERATED=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ No test files found"
            echo "REPORT_GENERATED=false" >> $GITHUB_OUTPUT
          fi

          # Debug: Show generated files
          echo "Generated files in $OUTPUT_DIR:"
          find $OUTPUT_DIR -type f | head -20 || echo "No files"

          echo "Generated files in $SINGLE_FILE_DIR:"
          find $SINGLE_FILE_DIR -type f | head -20 || echo "No files"

      - name: Upload Reports to S3
        if: steps.generate.outputs.REPORT_GENERATED == 'true'
        env:
          TEST_TYPE: ${{ steps.parse_path.outputs.TEST_TYPE }}
          TIMESTAMP_PATH: ${{ steps.parse_path.outputs.TIMESTAMP_PATH }}
          PARSED_SAFE_ID: ${{ steps.parse_path.outputs.SAFE_ID }}
        run: |
          REPORT_BASE_PATH="Report/$TEST_TYPE/$TIMESTAMP_PATH"

          echo "Uploading to: s3://$S3_BUCKET/$REPORT_BASE_PATH/"

          # Clean existing reports
          aws s3 rm "s3://$S3_BUCKET/$REPORT_BASE_PATH/" --recursive --quiet || true

          # Upload multi-file report if it exists
          if [ -f "$OUTPUT_DIR/index.html" ]; then
            echo "Uploading multi-file report..."
            aws s3 sync "$OUTPUT_DIR/" "s3://$S3_BUCKET/$REPORT_BASE_PATH/allure-report/" --quiet
            MULTI_URL="https://atp-reports.dev.qubership.org/$REPORT_BASE_PATH/allure-report/index.html"
            echo "MULTI_URL=$MULTI_URL" >> $GITHUB_ENV
          fi

          # Upload single-file report
          SINGLE_FILE=$(find $SINGLE_FILE_DIR -name "*.html" | head -1)
          if [ -n "$SINGLE_FILE" ]; then
            SINGLE_NAME="allure-report-${PARSED_SAFE_ID}.html"
            echo "Uploading single-file as: $SINGLE_NAME"

            # Copy and rename
            cp "$SINGLE_FILE" "$SINGLE_FILE_DIR/$SINGLE_NAME"
            aws s3 cp "$SINGLE_FILE_DIR/$SINGLE_NAME" "s3://$S3_BUCKET/$REPORT_BASE_PATH/$SINGLE_NAME" --quiet
            echo "DIRECT_S3_LINK=s3://$S3_BUCKET/$REPORT_BASE_PATH/" >> $GITHUB_ENV

            SINGLE_URL="https://atp-reports.dev.qubership.org/$REPORT_BASE_PATH/$SINGLE_NAME"
            echo "SINGLE_URL=$SINGLE_URL" >> $GITHUB_ENV
          fi

          # Create a test file to verify upload
          echo "Test upload successful at $(date) for test type: $TEST_TYPE" > upload-test.txt
          aws s3 cp upload-test.txt "s3://$S3_BUCKET/$REPORT_BASE_PATH/upload-test.txt"

      # - name: Create Artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-debug-${{ steps.parse_path.outputs.SAFE_ID }}
      #     path: |
      #       $SOURCE_DIR/
      #       $OUTPUT_DIR/
      #       $SINGLE_FILE_DIR/
      #     retention-days: 7

      - name: Output Results
        env:
          PARSED_S3_DIR: ${{ steps.parse_path.outputs.S3_DIR }}
          PARSED_TEST_TYPE: ${{ steps.parse_path.outputs.TEST_TYPE }}
          PARSED_TIMESTAMP_PATH: ${{ steps.parse_path.outputs.TIMESTAMP_PATH }}
          DOWNLOADED_XML_FILES: ${{ steps.download.outputs.XML_FILES }}
          DOWNLOADED_JSON_FILES: ${{ steps.download.outputs.JSON_FILES }}
          REPORT_GENERATED: ${{ steps.generate.outputs.REPORT_GENERATED }}
        run: |
          echo ""
          echo "========================================"
          echo "RESULTS SUMMARY"
          echo "========================================"
          echo ""
          echo "Source: $PARSED_S3_DIR"
          echo "Test Type: $PARSED_TEST_TYPE"
          echo "Timestamp: $PARSED_TIMESTAMP_PATH"
          echo "Test files: $DOWNLOADED_XML_FILES XML, $DOWNLOADED_JSON_FILES JSON"
          echo ""

          if [ "$REPORT_GENERATED" = "true" ]; then
            echo "✅ REPORTS GENERATED"
            echo ""

            if [ -n "$MULTI_URL" ]; then
              echo "📊 Multi-file report:"
              echo "   $MULTI_URL"
            fi

            if [ -n "$SINGLE_URL" ]; then
              echo ""
              echo "📥 Single-file report:"
              echo "   $SINGLE_URL"
              echo ""
              echo "Download command:"
              echo "curl -LO '$SINGLE_URL'"
            fi
          else
            echo "❌ REPORTS FAILED"
            echo ""
            echo "Check the 'Debug Allure Results' step for details."
            echo "Common issues:"
            echo "1. XML files not in Allure format"
            echo "2. Missing required XML structure"
            echo "3. Allure compatibility issue"
          fi

      - name: Send email notification
        uses: netcracker/qubership-workflow-hub/actions/email-action@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_USERNAME: ${{ vars.EMAIL_FROM }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
        with:
          to: ${{ secrets.EMAIL_RECIPIENT_1 }}, ${{ secrets.EMAIL_RECIPIENT_2 }}, ${{ secrets.EMAIL_RECIPIENT_ATP }}
          subject: "Allure reports - ${{ steps.parse_path.outputs.TEST_TYPE }} - Pass Rate: ${{ steps.pass_rate.outputs.PASS_RATE }}"
          body: |
            Hello,

            The Allure report has been successfully generated for **${{ steps.parse_path.outputs.TEST_TYPE }}**.

            📊 **Test Results:**
            - Total Tests: ${{ steps.pass_rate.outputs.TOTAL_TESTS }}
            - Passed: ${{ steps.pass_rate.outputs.PASSED_TESTS }}
            - Skipped: ${{ steps.pass_rate.outputs.SKIPPED_TESTS }}
            - **Pass Rate: ${{ steps.pass_rate.outputs.PASS_RATE }}** (based on executed tests only)

            DOWNLOAD LINKS:
            Single report file: ${{ env.SINGLE_URL }}
            Multi report file: ${{ env.MULTI_URL }}
            Direct link for usage with WinSCP or analog viewers (needs authorization): ${{ env.DIRECT_S3_LINK }}

            Best regards,
            DevOps Team

      - name: Trigger Results Push to Git
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'allure-sync-results.yaml',
              ref: 'main'
            })
