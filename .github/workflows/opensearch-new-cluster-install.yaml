name: Install Opensearch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: false
        default: "dev"

jobs:
  Install-Opensearch:
    permissions:
      contents: read
    environment: "${{github.event.inputs.environment}}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone public qubership-opensearch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Netcracker/qubership-opensearch
          path: qubership-opensearch

      - name: Listing downloaded files
        run: |
          pwd
          ls -R qubership-opensearch

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.32.0'

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify tools
        run: |
          kubectl version --client
          helm version
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure kubeconfig for EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          EKS_CLUSTER_NAME: ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Install Opensearch
        env:
          OPENSEARCH_INSTALL_NAMESPACE: ${{ vars.TF_VAR_OPENSEARCH_INSTALL_NAMESPACE }}
        run: |
          cd ./opensearch
          echo "Namespace to install: $OPENSEARCH_INSTALL_NAMESPACE"
          helm install --namespace="$OPENSEARCH_INSTALL_NAMESPACE" --create-namespace -f ./example-config.yaml opensearch ../qubership-opensearch/
