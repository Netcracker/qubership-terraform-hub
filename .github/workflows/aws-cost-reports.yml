name: AWS Cost Report
run-name: Generate AWS Cost Report from ${{ github.event.inputs.start_date || 'first day of current month' }} to ${{ github.event.inputs.end_date || 'tomorrow' }}

on:
  # 1st of each month at 06:00 UTC — report for the current month (through today)
  schedule:
    - cron: '0 6 1 * *'
  # Manual run with optional date range
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Empty = first day of current month'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive). Empty = today'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install boto3 jinja2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Cost Explorer API is only available in us-east-1; S3 client uses this region too
          # unless the bucket is in another region (set AWS_REGION secret if needed)
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Generate report and upload to S3
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          S3_BUCKET: 'cve-reports-dev'
          S3_PREFIX: 'aws-cost-reports'
          RUN_ID: ${{ github.run_id }}
          # Presigned URL lifetime in hours (0 = skip). Override via repo variable PRESIGN_HOURS.
          PRESIGN_HOURS: ${{ vars.PRESIGN_HOURS || '4' }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Secret S3_BUCKET is not set"
            exit 1
          fi
          python aws-cost-reports/generate_aws_cost_report.py \
            --start-date "${START_DATE:-}" \
            --end-date "${END_DATE:-}" \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "$S3_PREFIX" \
            --run-id "$RUN_ID" \
            --presign-hours "${PRESIGN_HOURS}"
