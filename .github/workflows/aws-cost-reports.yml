name: AWS Cost Report

on:
  # 1st of each month at 06:00 UTC — full previous calendar month, email always sent
  schedule:
    - cron: '0 6 1 * *'
  # Manual run with optional date range and optional email
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Empty = first day of current month'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive). Empty = today'
        required: false
        type: string
      trend_months:
        description: 'Months of spend trend to include (default 3)'
        required: false
        type: string
        default: '3'
      include_usage:
        description: 'Include the optional Usage by type table (extra API calls)'
        required: false
        type: boolean
        default: false
      send_email:
        description: 'Send the HTML report by email'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install boto3 jinja2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Cost Explorer API is only available in us-east-1; S3 client uses this region too
          # unless the bucket is in another region (set AWS_REGION secret if needed)
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Generate report and upload to S3
        id: report
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          TREND_MONTHS: ${{ github.event.inputs.trend_months || '3' }}
          INCLUDE_USAGE: ${{ github.event.inputs.include_usage }}
          S3_BUCKET: 'cve-reports-dev'
          S3_PREFIX: 'aws-cost-reports'
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Secret S3_BUCKET is not set"
            exit 1
          fi
          EXTRA=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            EXTRA+=(--previous-month)
          fi
          if [ "$INCLUDE_USAGE" = "true" ]; then
            EXTRA+=(--include-usage)
          fi
          python aws-cost-reports/generate_aws_cost_report.py \
            --start-date "${START_DATE:-}" \
            --end-date "${END_DATE:-}" \
            --trend-months "${TREND_MONTHS:-3}" \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "$S3_PREFIX" \
            --run-id "$RUN_ID" \
            --local-dir ./out \
            "${EXTRA[@]}"

      - name: Send email
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send_email == 'true' }}
        uses: netcracker/qubership-workflow-hub/actions/email-action@27fd7674286e5f561a6fd8277f2f389ff96ddb9e  # v2.6.0
        with:
          server-address: smtp.gmail.com
          server-port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: 'AWS Cost Reports <${{ secrets.SMTP_USERNAME }}>'
          to: 'boris.lavrishchev.qubership@gmail.com,pavel.anikin.qubership@gmail.com' # ${{ secrets.EMAIL_RECIPIENT_1 }}, ${{ secrets.EMAIL_RECIPIENT_2 }}
          subject: AWS Cost Report — ${{ steps.report.outputs.period_label }}
          html-body: file://out/email-body.html
          attachments: out/report.html
