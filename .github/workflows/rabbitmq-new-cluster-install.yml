name: Install Rabbit-MQ

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: false
        default: "dev"

jobs:
  Install-Rabbit-MQ:
    uses: ./.github/workflows/_install-helm-component.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    with:
      component_name: Rabbit-MQ
      environment: "${{ github.event.inputs.environment }}"
      chart_repo: Netcracker/qubership-rabbitmq
      chart_path: operator/charts/helm/rabbitmq
      values_dir: ./rabbitmq
      values_file: example-config.yaml
      release_name: rabbitmq-service
      namespace_var: TF_VAR_RABBIT_INSTALL_NAMESPACE
