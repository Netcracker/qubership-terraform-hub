name: Minio New Cluster Installation

# NOTE: Requires a minio/ Terraform module (not present in this repository yet).

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Minio cluster name'
        required: true
      base_url:
        description: 'Base URL for Minio API'
        required: true
      access_key:
        description: 'Minio access key'
        required: true
      secret_key:
        description: 'Minio secret key'
        required: true
        type: string
      region:
        description: 'Minio region'
        default: 'us-east-1'
        required: false
      drive_count:
        description: 'Number of drives per node'
        default: '1'
        required: false
      storage_class:
        description: 'Storage class (STANDARD, REDUCED_REDUNDANCY, etc.)'
        default: 'STANDARD'
        required: false
      tags:
        description: 'Tags for Minio resources (format: key1=value1,key2=value2)'
        required: false

env:
  TF_WORKSPACE: minio-${{ github.event.inputs.cluster_name }}

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ env.TF_WORKSPACE }}
      cluster_name: ${{ github.event.inputs.cluster_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Create Terraform workspace
        run: |
          terraform workspace new $TF_WORKSPACE || terraform workspace select $TF_WORKSPACE

      - name: Set up outputs
        env:
          CLUSTER_NAME: ${{ github.event.inputs.cluster_name }}
        run: |
          echo "Workspace: $TF_WORKSPACE"
          echo "Cluster name: $CLUSTER_NAME"

  plan:
    permissions:
      contents: read
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Select Terraform workspace
        env:
          TF_TARGET_WORKSPACE: ${{ needs.setup.outputs.workspace }}
        run: terraform workspace select "$TF_TARGET_WORKSPACE"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_secret_key: ${{ github.event.inputs.secret_key }}
          CLUSTER_NAME: ${{ github.event.inputs.cluster_name }}
          BASE_URL: ${{ github.event.inputs.base_url }}
          ACCESS_KEY: ${{ github.event.inputs.access_key }}
          SECRET_KEY: ${{ github.event.inputs.secret_key }}
          MINIO_REGION: ${{ github.event.inputs.region }}
          DRIVE_COUNT: ${{ github.event.inputs.drive_count }}
          STORAGE_CLASS: ${{ github.event.inputs.storage_class }}
          RESOURCE_TAGS: ${{ github.event.inputs.tags }}
        run: |
          terraform plan \
            -var="cluster_name=$CLUSTER_NAME" \
            -var="base_url=$BASE_URL" \
            -var="access_key=$ACCESS_KEY" \
            -var="secret_key=$SECRET_KEY" \
            -var="region=$MINIO_REGION" \
            -var="drive_count=$DRIVE_COUNT" \
            -var="storage_class=$STORAGE_CLASS" \
            -var="tags=$RESOURCE_TAGS" \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.event.inputs.cluster_name }}
          path: tfplan
          retention-days: 1

  apply:
    permissions:
      contents: read
    needs: [setup, plan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.event.inputs.cluster_name }}

      - name: Select Terraform workspace
        env:
          TF_TARGET_WORKSPACE: ${{ needs.setup.outputs.workspace }}
        run: terraform workspace select "$TF_TARGET_WORKSPACE"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply tfplan

      - name: Get Minio endpoints
        id: endpoints
        run: |
          MINIO_ENDPOINT=$(terraform output -raw minio_endpoint)
          CONSOLE_ENDPOINT=$(terraform output -raw console_endpoint || echo "N/A")
          echo "minio_endpoint=$MINIO_ENDPOINT" >> $GITHUB_OUTPUT
          echo "console_endpoint=$CONSOLE_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        env:
          CLUSTER_NAME: ${{ github.event.inputs.cluster_name }}
          MINIO_ENDPOINT: ${{ steps.endpoints.outputs.minio_endpoint }}
          CONSOLE_ENDPOINT: ${{ steps.endpoints.outputs.console_endpoint }}
          ACCESS_KEY: ${{ github.event.inputs.access_key }}
          MINIO_REGION: ${{ github.event.inputs.region }}
          STORAGE_CLASS: ${{ github.event.inputs.storage_class }}
        run: |
          {
            echo "## Minio Cluster Deployment Complete"
            echo ""
            echo "**Cluster Name:** $CLUSTER_NAME"
            echo ""
            echo "**Access Information:**"
            echo "- Minio Endpoint: $MINIO_ENDPOINT"
            echo "- Console Endpoint: $CONSOLE_ENDPOINT"
            echo "- Access Key: $ACCESS_KEY"
            echo "- Region: $MINIO_REGION"
            echo "- Storage Class: $STORAGE_CLASS"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    permissions:
      contents: read
    needs: [apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          if [ "$APPLY_RESULT" == "success" ]; then
            echo "Minio cluster deployment successful"
          else
            echo "Minio cluster deployment failed"
            exit 1
          fi
