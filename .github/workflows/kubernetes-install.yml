name: Kubernetes and Infra Install

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: false
        default: "dev"
      tf-prepare:
        type: boolean
        default: false
      tf-apply:
        type: boolean
        default: false
      tf-destroy:
        type: boolean
        default: false
      pg-install:
        type: boolean
        default: false
      consul-install:
        type: boolean
        default: false
      zookeeper-install:
        type: boolean
        default: false
      kafka-install:
        type: boolean
        default: false
      rabbitmq-install:
        type: boolean
        default: false
      cassandra-install:
        type: boolean
        default: false


jobs:
  running-inputs:
    permissions:
      contents: read
    environment: "${{github.event.inputs.environment}}"
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "Deploying to: ${{ github.event.inputs.environment }}"
          echo "tf-prepare: ${{ github.event.inputs.tf-prepare }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"
          echo "EKS cluster name: ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}"
        env:
          ENV_VAR: ${{ vars.ENV_VAR }}
  tf-prepare:
    permissions:
      contents: read
    needs: running-inputs
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.tf-prepare == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Verify tools
        run: |
          terraform version
          kubectl version --client
          helm version
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init and Plan
        run: |
          cd ./kubernetes-terraform
          terraform init
          if ! terraform workspace list | grep -q ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}; then
          terraform workspace new ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          echo "Create new env for TF state"
          fi
          terraform workspace select ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          terraform plan -var "EKS_NEW_CLUSTERNAME=${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}" -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          path: kubernetes-terraform/tfplan
          retention-days: 1

  tf-apply:
    permissions:
      contents: read
    needs: [running-inputs, tf-prepare]
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.tf-apply == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Download Terraform plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          path: kubernetes-terraform

      - name: Terraform Apply
        run: |
          cd ./kubernetes-terraform
          terraform init
          if ! terraform workspace list | grep -q ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}; then
          terraform workspace new ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          echo "Create new env for TF state"
          fi
          terraform workspace select ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          terraform apply -auto-approve tfplan

  tf-post-install:
    permissions:
      contents: read
    needs: tf-apply
    environment: "${{github.event.inputs.environment}}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION || 'us-east-1' }} --name ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}

      - name: Terraform Post Install
        run: |
          cd ./kubernetes-terraform/post-configuration/
          terraform init
          if ! terraform workspace list | grep -q ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}; then
          terraform workspace new ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          fi
          terraform workspace select ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          terraform apply -var "EKS_NEW_CLUSTERNAME=${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}" -auto-approve

  tf-destroy:
    permissions:
      contents: read
    if: github.event.inputs.tf-destroy == 'true'
    environment: "${{github.event.inputs.environment}}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Destroy
        run: |
          cd ./kubernetes-terraform
          terraform init
          if ! terraform workspace list | grep -q ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}; then
          terraform workspace new ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          echo "Create new env for TF state"
          fi
          terraform workspace select ${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}
          terraform destroy -var "EKS_NEW_CLUSTERNAME=${{ vars.TF_VAR_EKS_NEW_CLUSTERNAME }}" -auto-approve

  pg-install:
    permissions:
      actions: write
    needs: tf-post-install
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.pg-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.pg-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger PG install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'postgres-new-cluster-install.yml',
              ref: 'main'
            })

  consul-install:
    permissions:
      actions: write
    needs: tf-post-install
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.consul-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.consul-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger Consul install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'consul-new-cluster-install.yml',
              ref: 'main'
            })

  zookeeper-install:
    permissions:
      actions: write
    needs: tf-post-install
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.zookeeper-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.zookeeper-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger Zookeeper install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'zookeeper-new-cluster-install.yml',
              ref: 'main'
            })

  kafka-install:
    permissions:
      actions: write
    needs: [tf-post-install, zookeeper-install]
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.kafka-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.kafka-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger Kafka install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kafka-new-cluster-install.yml',
              ref: 'main'
            })

  rabbitmq-install:
    permissions:
      actions: write
    needs: tf-post-install
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.rabbitmq-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.rabbitmq-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger Rabbitmq install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rabbitmq-new-cluster-install.yml',
              ref: 'main'
            })

  cassandra-install:
    permissions:
      actions: write
    needs: tf-post-install
    environment: "${{github.event.inputs.environment}}"
    if: github.event.inputs.cassandra-install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "tf-prepare: ${{ github.event.inputs.cassandra-install }}"
          echo "JSON: ${{ toJSON(github.event.inputs) }}"

      - name: Trigger Cassandra install workflow
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cassandra-new-cluster-install.yaml',
              ref: 'main'
            })
