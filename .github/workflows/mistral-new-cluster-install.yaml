name: Install Mistral

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: false
        default: "dev"

jobs:
  Install-Mistral:
    uses: ./.github/workflows/_install-helm-component.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    with:
      component_name: Mistral
      environment: "${{ github.event.inputs.environment }}"
      chart_repo: Netcracker/qubership-mistral-operator
      chart_path: deployments/charts/mistral-operator
      values_dir: ./mistral
      values_file: example-values.yaml
      release_name: mistral-operator
      namespace_var: TF_VAR_MISTRAL_INSTALL_NAMESPACE
