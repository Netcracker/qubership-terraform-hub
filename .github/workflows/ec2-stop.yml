name: Scheduled Stop of EC2 Instances

permissions:
  contents: read

on:
  schedule:
    - cron: '0 17 * * 1-5'

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only show what would be stopped / deleted)"
        required: false
        default: false
        type: boolean
      delete_target_groups:
        description: "Also delete Target Groups associated with Load Balancers"
        required: false
        default: false
        type: boolean

jobs:
  stop-instances:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tools
        run: |
          aws --version
          yq --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Debug
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          DELETE_TARGET_GROUPS_INPUT: ${{ github.event.inputs.delete_target_groups }}
        run: |
          echo "Triggered by: $EVENT_NAME"
          echo "Dry run: $DRY_RUN_INPUT"
          echo "Delete Target Groups: $DELETE_TARGET_GROUPS_INPUT"
          echo "Clusters config:"
          cat ./ec2-scheduled/clusters.yaml

      - name: Stop ASGs and delete Load Balancers
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
          DELETE_TGS: ${{ github.event.inputs.delete_target_groups || false }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          cd ./ec2-scheduled

          # ------------------------------------------------------------
          # Mode
          # ------------------------------------------------------------
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            echo "⏰ Scheduled run - applying changes for real"
            CURRENT_MODE="real"
            # On scheduled runs, Target Groups are not deleted by default
            DELETE_TGS="false"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "🧪 MANUAL DRY RUN - Only showing what would be done"
            CURRENT_MODE="dry"
          else
            echo "🚀 MANUAL REAL RUN - Applying changes"
            CURRENT_MODE="real"
          fi

          echo "Delete Target Groups: $DELETE_TGS"

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------
          should_stop_asg() {
            local asg_name=$1

            if [[ -z "$asg_name" ]]; then
              return 1
            fi

            TAG_VALUE=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$asg_name" \
              --query "AutoScalingGroups[0].Tags[?Key=='autostop'].Value" \
              --output text 2>/dev/null || true)

            if [[ -z "$TAG_VALUE" ]]; then
              echo "  ℹ️  No autostop tag → will stop"
              return 0
            fi

            if [[ "$TAG_VALUE" == "true" ]]; then
              echo "  ℹ️  autostop=true → will stop"
              return 0
            else
              echo "  ⏸️  autostop=false → will NOT stop"
              return 1
            fi
          }

          show_asg_state() {
            local asg_name=$1
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$asg_name" \
              --query 'AutoScalingGroups[0].{Min:MinSize, Max:MaxSize, Desired:DesiredCapacity, Instances:length(Instances)}' \
              --output table 2>/dev/null || echo "  ⚠️  Failed to describe ASG"
          }

          # ------------------------------------------------------------
          # 1. Process ASGs from clusters.yaml
          # ------------------------------------------------------------
          echo ""
          echo "========================================"
          echo "Processing Auto Scaling Groups..."
          echo "========================================"

          CLUSTER_COUNT=$(yq '.clusters | length' clusters.yaml)

          for (( i=0; i<CLUSTER_COUNT; i++ )); do
            CLUSTER_NAME=$(yq -r ".clusters[$i].name" clusters.yaml)
            echo ""
            echo "▶ Cluster: $CLUSTER_NAME"

            ASG_COUNT=$(yq ".clusters[$i].asgs | length" clusters.yaml)

            for (( j=0; j<ASG_COUNT; j++ )); do
              ASG=$(yq -r ".clusters[$i].asgs[$j]" clusters.yaml)
              echo "----------------------------------------"
              echo "ASG: $ASG"

              if [[ -z "$ASG" ]]; then
                echo "  ⚠️  Empty ASG name, skipping"
                continue
              fi

              if ! aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-names "$ASG" \
                    --query 'AutoScalingGroups[0]' \
                    --output text >/dev/null 2>&1; then
                echo "  ⚠️  ASG not found, skipping"
                continue
              fi

              if should_stop_asg "$ASG"; then
                show_asg_state "$ASG"

                if [[ "$CURRENT_MODE" == "real" ]]; then
                  echo "  🛑 Scaling ASG to 0..."
                  if aws autoscaling update-auto-scaling-group \
                       --auto-scaling-group-name "$ASG" \
                       --min-size 0 --max-size 0 --desired-capacity 0; then
                    echo "  ✅ Successfully stopped $ASG"
                  else
                    echo "  ❌ Failed to stop $ASG"
                  fi
                else
                  echo "  📋 Would scale to 0:"
                  echo "     aws autoscaling update-auto-scaling-group \\"
                  echo "       --auto-scaling-group-name $ASG \\"
                  echo "       --min-size 0 --max-size 0 --desired-capacity 0"
                fi
              else
                echo "  ⏭️  Skipped"
              fi
            done
          done

          # ------------------------------------------------------------
          # 2. Delete Load Balancers
          # ------------------------------------------------------------
          echo ""
          echo "========================================"
          echo "Cleaning up Load Balancers..."
          echo "========================================"

          for (( i=0; i<CLUSTER_COUNT; i++ )); do
            CLUSTER_NAME=$(yq -r ".clusters[$i].name" clusters.yaml)
            echo ""
            echo "▶ Cluster: $CLUSTER_NAME"

            mapfile -t ALL_LB_ARNS < <(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[].LoadBalancerArn" \
              --output text 2>/dev/null | tr '\t' '\n' || true)

            if [[ ${#ALL_LB_ARNS[@]} -eq 0 || -z "${ALL_LB_ARNS[0]:-}" ]]; then
              echo "  No load balancers found in region"
              continue
            fi

            found=0

            for ARN in "${ALL_LB_ARNS[@]}"; do
              [[ -z "$ARN" ]] && continue

              TAG_VALUE=$(aws elbv2 describe-tags \
                --resource-arns "$ARN" \
                --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value | [0]" \
                --output text 2>/dev/null || true)

              if [[ "$TAG_VALUE" != "$CLUSTER_NAME" ]]; then
                continue
              fi

              found=1

              LB_NAME=$(aws elbv2 describe-load-balancers \
                --load-balancer-arns "$ARN" \
                --query "LoadBalancers[0].LoadBalancerName" \
                --output text)

              LB_TYPE=$(aws elbv2 describe-load-balancers \
                --load-balancer-arns "$ARN" \
                --query "LoadBalancers[0].Type" \
                --output text)

              PROTECTION=$(aws elbv2 describe-load-balancer-attributes \
                --load-balancer-arn "$ARN" \
                --query "Attributes[?Key=='deletion_protection.enabled'].Value | [0]" \
                --output text 2>/dev/null || echo "false")

              echo "  Found $LB_TYPE: $LB_NAME"
              echo "  ARN: $ARN"
              echo "  deletion_protection: $PROTECTION"

              if [[ "$PROTECTION" == "true" ]]; then
                echo "  ⚠️  deletion_protection is enabled → SKIPPING"
                continue
              fi

              if [[ "$CURRENT_MODE" == "real" ]]; then
                # Optionally delete Target Groups
                if [[ "$DELETE_TGS" == "true" ]]; then
                  mapfile -t TG_ARNS < <(aws elbv2 describe-target-groups \
                    --load-balancer-arn "$ARN" \
                    --query "TargetGroups[].TargetGroupArn" \
                    --output text 2>/dev/null | tr '\t' '\n' || true)

                  for TG in "${TG_ARNS[@]}"; do
                    [[ -z "$TG" ]] && continue
                    echo "    → Deleting Target Group: $TG"
                    aws elbv2 delete-target-group --target-group-arn "$TG" 2>/dev/null || \
                      echo "      ⚠️  Could not delete TG (possibly still in use)"
                  done
                else
                  echo "    ℹ️  Skipping Target Groups deletion (delete_target_groups=false)"
                fi

                echo "    → Deleting Load Balancer..."
                if aws elbv2 delete-load-balancer --load-balancer-arn "$ARN"; then
                  echo "    ✅ Successfully deleted $LB_NAME"
                else
                  echo "    ❌ Failed to delete $LB_NAME"
                fi
              else
                echo "  📋 Would delete $LB_TYPE: $LB_NAME"
                if [[ "$DELETE_TGS" == "true" ]]; then
                  echo "     (and its Target Groups)"
                fi
              fi
            done

            if [[ $found -eq 0 ]]; then
              echo "  No LBs found with tag elbv2.k8s.aws/cluster=$CLUSTER_NAME"
            fi
          done

          # ------------------------------------------------------------
          # Finish
          # ------------------------------------------------------------
          echo ""
          echo "----------------------------------------"
          if [[ "$CURRENT_MODE" == "dry" ]]; then
            echo "🧪 Dry run completed. No changes made."
          else
            echo "✅ All eligible ASGs and Load Balancers processed."
          fi
