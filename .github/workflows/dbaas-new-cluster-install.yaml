name: Install DBaaS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: false
        default: "dev"

jobs:
  Install-DBaaS:
    uses: ./.github/workflows/_install-helm-component.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    with:
      component_name: DBaaS
      environment: "${{ github.event.inputs.environment }}"
      chart_repo: Netcracker/qubership-dbaas
      chart_path: helm-templates/dbaas-aggregator
      values_dir: ./dbaas
      values_file: example-config.yaml
      release_name: dbaas
      namespace: ${{ vars.TF_VAR_DBAAS_INSTALL_NAMESPACE }}
