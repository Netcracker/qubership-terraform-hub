name: EC2 Instance Control

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      aws_region:
        description: 'AWS region where the EC2 instance is located'
        required: false
        type: string
        default: 'us-east-1'
      instance_id:
        description: 'EC2 instance ID to control'
        required: true
        type: string
      action:
        description: 'Action to perform (start or stop)'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  control-ec2-instance:
    permissions:
      contents: read
    name: Control EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate action input
        env:
          EC2_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EC2_ACTION" != "start" ] && [ "$EC2_ACTION" != "stop" ]; then
            echo "Error: Action must be either 'start' or 'stop'"
            exit 1
          fi

      - name: ${{ inputs.action }} EC2 instance
        env:
          EC2_ACTION: ${{ inputs.action }}
          INSTANCE_ID: ${{ inputs.instance_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          if [ "$EC2_ACTION" == "start" ]; then
            echo "Starting instance $INSTANCE_ID"
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
          else
            echo "Stopping instance $INSTANCE_ID"
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
          fi

      - name: Wait for instance to reach desired state
        env:
          EC2_ACTION: ${{ inputs.action }}
          INSTANCE_ID: ${{ inputs.instance_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          if [ "$EC2_ACTION" == "start" ]; then
            echo "Waiting for instance to start..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            echo "Instance is now running"
          else
            echo "Waiting for instance to stop..."
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            echo "Instance is now stopped"
          fi

      - name: Get instance status
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text
