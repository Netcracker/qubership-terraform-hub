name: Backup MM and Wiki VMs

on:
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      mattermost_files:
        description: Include Mattermost data files
        type: boolean
        default: false

permissions:
  id-token: write # AWS OIDC

env:
  S3_BUCKET: ${{ vars.AWS_BACKUP_S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_BACKUP_OIDC }}
  # runs on the VM before matrix.script.
  PRELUDE: |
    set -euo pipefail
    tmp=~/backup; mkdir -p -m 700 "$tmp"; trap 'rm -f "$tmp"/*.dump' EXIT

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # explicit shell adds -o pipefail
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mattermost
            host: mattermost.qubership.org
            script: |
              sudo -u postgres pg_dump -Fc mattermost > "$tmp/mattermost.dump"
              sudo tar -czf - -C "$tmp" mattermost.dump -C /opt/mattermost config
            script_files: |
              sudo -u postgres pg_dump -Fc mattermost > "$tmp/mattermost.dump"
              sudo tar -czf - -C "$tmp" mattermost.dump -C /opt/mattermost config -C /var/opt/mattermost data
          - name: wiki
            host: wiki.qubership.org
            # < /dev/null: the script reaches the VM on stdin (bash -s), and docker
            # exec would otherwise swallow the rest of it, so tar never ran
            script: |
              sudo docker compose -f /opt/wiki/compose.yaml exec -T db pg_dump -U wikijs -Fc wiki < /dev/null > "$tmp/wiki.dump"
              sudo tar -czf - --exclude=nginx/config/log -C "$tmp" wiki.dump -C /opt/wiki compose.yaml nginx

    steps:
    - name: Set up SSH
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_backup
        chmod 600 ~/.ssh/id_backup
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      env:
        SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        KNOWN_HOSTS: ${{ vars.BACKUP_KNOWN_HOSTS }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-duration-seconds: 21600 # the data files upload can outlast the default hour

    # ponytail: the archive is downloaded to the runner disk first (~14 GB free
    # is all GitHub guarantees); if the Mattermost data files outgrow it, move
    # to a larger runner or go back to streaming. Retention is a bucket lifecycle rule
    - name: Create backup on VM and download it
      run: |
        file="$RUNNER_TEMP/backup-$NAME-$(date -u +%Y%m%d-%H%M%S).tar.gz"
        echo "file=$file" >> "$GITHUB_ENV"
        df -h "$RUNNER_TEMP"
        ssh -i ~/.ssh/id_backup "$SSH_USER@$HOST" 'bash -s' <<<"$PRELUDE$SCRIPT" > "$file"
        ls -l "$file"
      env:
        NAME: ${{ matrix.name }}
        HOST: ${{ matrix.host }}
        SCRIPT: ${{ inputs.mattermost_files && matrix.script_files || matrix.script }}
        SSH_USER: ${{ secrets.BACKUP_SSH_USER }}

    - name: Verify archive
      run: |
        fail() { echo "::error::$1"; exit 1; }
        list="$RUNNER_TEMP/contents.txt"
        [ -s "$file" ] || fail "$(basename "$file") is empty"
        # reads the whole archive: fails on a truncated or corrupt gzip stream
        tar -tvzf "$file" > "$list" || fail "archive is truncated or corrupt"
        head -n 50 "$list"
        echo "total entries: $(wc -l < "$list")"
        dump_size=$(awk -v f="$NAME.dump" '$NF == f { print $3; exit }' "$list")
        [ "${dump_size:-0}" -gt 0 ] || fail "$NAME.dump is missing from the archive or empty"
        # pg_dump -Fc output starts with the PGDMP magic
        [ "$(tar -xzOf "$file" --occurrence=1 "$NAME.dump" | head -c 5)" = PGDMP ] ||
          fail "$NAME.dump is not a PostgreSQL custom-format dump"
        echo "dump_size=$dump_size" >> "$GITHUB_ENV"
      env:
        NAME: ${{ matrix.name }}

    - name: Upload to S3
      run: |
        dest="s3://$S3_BUCKET/$NAME/$(basename "$file")"
        # the CLI checksums the upload, S3 rejects a mismatch and cp exits non-zero
        aws s3 cp --no-progress "$file" "$dest"
        size=$(stat -c %s "$file")
        s3_size=$(aws s3api head-object --bucket "$S3_BUCKET" --key "$NAME/$(basename "$file")" \
          --query ContentLength --output text)
        [ "$s3_size" = "$size" ] ||
          { echo "::error::size mismatch: $size bytes on the runner, $s3_size in S3"; exit 1; }
        {
          echo "### :white_check_mark: $NAME backup uploaded to S3"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Object | \`$dest\` |"
          echo "| Archive size | $(numfmt --to=iec-i --suffix=B "$size") (verified in S3) |"
          echo "| \`$NAME.dump\` size | $(numfmt --to=iec-i --suffix=B "$dump_size") |"
          echo "| Entries in archive | $(wc -l < "$RUNNER_TEMP/contents.txt") |"
          echo "| SHA-256 | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        NAME: ${{ matrix.name }}
